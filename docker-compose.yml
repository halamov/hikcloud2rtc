# hikcloud2rtc: Hik-Connect NVR → локальный HTTP-сервис потока и снапшотов
#
# Сборка и запуск:
#   cp .env.example .env          # вписать HIK_USER / HIK_PASSWORD / HIKCLOUD2RTC_TAG
#   docker compose up -d --build
#
# Тег образа: 0.<ГГ><ММ><ДД>.<ЧЧ> (время сборки), генерация:
#   HIKCLOUD2RTC_TAG=0.$(date +%y%m%d.%H)   # → напр. 0.261018.15
#
# Сервис:
#   hikcloud2rtc — python/FastAPI (:8000): логин в облако Hik-Connect,
#                  VTM-воркеры расшифровки (cloudcam/decrypt_proxy, HEVC+H.264)
#
# Как смотреть (HOST = <host>):
#   Поток (MPEG-TS, HEVC) — VLC «Открыть URL» / ffplay:
#     http://HOST:8000/stream.ts?channel=8&stream=sub    # 640x360
#     http://HOST:8000/stream.ts?channel=8&stream=main   # 1920x1080
#   Снапшот — браузер / curl:
#     http://HOST:8000/snapshot?channel=8                # из облака, ~352x288
#     http://HOST:8000/frame?channel=8&stream=main       # FullHD-кадр из потока
#
# Нужен RTSP/HLS/WebRTC? Поднять отдельно контейнер go2rtc с источником
#   ffmpeg:http://<host>:8000/stream.ts?channel=8&stream=sub#video=copy
# (см. README.md).

services:
  hikcloud2rtc:
    build:
      context: .
      dockerfile: Dockerfile
    image: hikcloud2rtc:${HIKCLOUD2RTC_TAG:?set HIKCLOUD2RTC_TAG in .env}
    container_name: hikcloud2rtc
    hostname: hikcloud2rtc
    network_mode: bridge
    restart: unless-stopped
    # console-лог: без блока logging — наследуем глобальный дефолт демона
    # (/etc/docker/daemon.json: json-file max-size 10m, max-file 1)
    ports:
      - "8000:8000"      # python API: /health /cameras /snapshot /frame /stream.ts /keys/*
    environment:
      # логин Hik-Connect (обязательно, через .env)
      - HIK_USER=${HIK_USER:?set HIK_USER in .env}
      - HIK_PASSWORD=${HIK_PASSWORD:?set HIK_PASSWORD in .env}
      - PORT=8000
      # данные (токены, cam-ключи) живут в volume (compose: hikcloud2rtc_data)
      - DATA_DIR=/app/data
      # логи (app.log + worker_*.log с ротацией) — в том же volume, переживают деплой
      - LOG_DIR=/app/data/logs
      # пути к файлам токена и ключей камер — единый набор имён cloudcam
      # (их же читает пакет cloudcam; старая пара TOKEN_FILE/CAM_KEYS_FILE упразднена)
      - CLOUDCAM_TOKEN_FILE=/app/data/token.json
      - CLOUDCAM_CAMKEY_FILE=/app/data/cam_keys.json
      # PacedWriter: очередь 2 МБ вместо 8 (у нас один зритель, не grid-23);
      # 1/4 МБ — если захотеть ещё меньше задержки
      - PACE_QUEUE_MB=2
      # платформа облака — берётся из .env (HIK_PLATFORM), по умолчанию hikconnect
      # значения (cloudcam/client.py PLATFORMS):
      #   hikconnect — Hik-Connect (api.hik-connect.com, clientType 55)
      #   ezviz      — EZVIZ / Ezviz Life (apiisgp.ezvizlife.com, clientType 1)
      # неизвестное значение молча заменяется на hikconnect (client.py:59)
      - CLOUDCAM_PLATFORM=${HIK_PLATFORM:-hikconnect}
      # PacedWriter: сглаживать ли кадровые bursts облака (GOP приходит за раз,
      # затем пауза ~2 с). 1 = кадры выдаются ровным потоком (плавная картинка,
      # глубина буфера ~1 с), 0 = кадры уходят сразу при получении (минимальная
      # задержка, но 2-с застытия и «перемотка» при GOP-передачах).
      - PACE_FRAMES=${PACE_FRAMES:-1}
      # Режим воркеров:
      #   always (по умолчанию) — воркеры живут 24/7: поток тёплый, любой
      #     /frame сразу, НО трафик с облака идёт постоянно (main ~18 ГБ/день,
      #     sub ~1.2 ГБ/день на камеру).
      #   idle — воркер убивается через WORKER_IDLE_TIMEOUT с без клиентов:
      #     трафик только во время опросов (сценарий «звонок в домофон»).
      #     Разбудить воркер заранее можно GET /prime?channel=N (тёплый старт).
      - WORKER_MODE=${WORKER_MODE:-always}
      # Через сколько секунд без клиентов убивать воркер (только в режиме idle)
      - WORKER_IDLE_TIMEOUT=${WORKER_IDLE_TIMEOUT:-90}
      # Часовой пояс контейнера (datetime/timezone, время в шапке /preview, логи):
      # tzdata в образе есть, TZ=Europe/Minsk берётся из .env
      - TZ=${TZ:-UTC}
    volumes:
      - data:/app/data    # token.json + cam_keys.json переживают рестарт
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data:
